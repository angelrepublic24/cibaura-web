name: CI

on:
  push:
    branches: [main, v1-launch-hardening]
  pull_request:

permissions:
  contents: read

jobs:
  web:
    name: Build / typecheck / lint / standalone
    runs-on: ubuntu-latest
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: node scripts/deploy-config-smoke.mjs
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run lint:suppressions
      - run: npm run build:ci
      - run: node scripts/standalone-smoke.mjs

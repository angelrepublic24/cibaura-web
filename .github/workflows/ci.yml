name: CI

on:
  push:
    branches: [main, v1-launch-hardening]
  pull_request:

permissions:
  contents: read

jobs:
  web:
    name: Build / typecheck / lint / standalone
    runs-on: ubuntu-latest
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Install pinned Caddy for edge smoke (no public certificates)
        run: |
          mkdir -p "$RUNNER_TEMP/caddy"
          cd "$RUNNER_TEMP/caddy"
          curl -fsSLO https://github.com/caddyserver/caddy/releases/download/v2.11.4/caddy_2.11.4_linux_amd64.tar.gz
          curl -fsSLO https://github.com/caddyserver/caddy/releases/download/v2.11.4/caddy_2.11.4_checksums.txt
          grep ' caddy_2.11.4_linux_amd64.tar.gz$' caddy_2.11.4_checksums.txt | sha512sum --check
          tar -xzf caddy_2.11.4_linux_amd64.tar.gz caddy
          echo "$RUNNER_TEMP/caddy" >> "$GITHUB_PATH"
      - run: node scripts/edge-smoke.mjs
      - run: node scripts/deploy-config-smoke.mjs
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run lint:suppressions
      - run: npm run build:ci
      - run: node scripts/standalone-smoke.mjs

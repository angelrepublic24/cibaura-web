services:
  web:
    image: ${WEB_IMAGE_REPOSITORY:-cibaura-web}:${WEB_IMAGE_TAG:-local}
    build:
      context: .
      args:
        WEB_VERSION: ${WEB_VERSION:-unreleased}
        WEB_REVISION: ${WEB_REVISION:-unknown}
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:?Set the public API URL}
        NEXT_PUBLIC_BUILD_SHA: ${NEXT_PUBLIC_BUILD_SHA:?Set the full build commit SHA}
        BUILD_ENV_PROBE_API: ${BUILD_ENV_PROBE_API:-false}
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:?Set the public site URL}
        NEXT_PUBLIC_MEDIA_URL: ${NEXT_PUBLIC_MEDIA_URL:-}
        NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: ${NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY:?Set the Stripe publishable key}
        NEXT_PUBLIC_STRIPE_ALLOW_TEST_KEY: ${NEXT_PUBLIC_STRIPE_ALLOW_TEST_KEY:-false}
        NEXT_PUBLIC_GOOGLE_MAPS_API_KEY: ${NEXT_PUBLIC_GOOGLE_MAPS_API_KEY:-}
        NEXT_PUBLIC_LEGAL_COMPANY_NAME: ${NEXT_PUBLIC_LEGAL_COMPANY_NAME:-}
        NEXT_PUBLIC_LEGAL_RNC: ${NEXT_PUBLIC_LEGAL_RNC:-}
        NEXT_PUBLIC_LEGAL_ADDRESS: ${NEXT_PUBLIC_LEGAL_ADDRESS:-}
        NEXT_PUBLIC_LEGAL_CONTACT_EMAIL: ${NEXT_PUBLIC_LEGAL_CONTACT_EMAIL:-}
    environment:
      PORT: ${PORT:-3000}
      HOSTNAME: 0.0.0.0
    ports:
      - "127.0.0.1:${WEB_HOST_PORT:-3000}:${PORT:-3000}"
    restart: unless-stopped
    init: true
    security_opt:
      - no-new-privileges:true
